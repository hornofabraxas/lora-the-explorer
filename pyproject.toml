[project]
name = "lora-the-explorer"
version = "0.2.2"
description = "A location-based exploration RPG played over LoRa mesh radio"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "meshcore>=2.3.0",
    "h3>=4.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1.0",
    "authlib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# Only needed to build/run the packaged Windows tray app (windows_tray.py).
# Not a dependency of the game itself — Docker, Linux, and `python -m
# lora_explorer` never import this module.
windows = [
    "pystray>=0.19.5",
    "pillow>=10.0",
    "pyinstaller>=6.10",
]

[project.scripts]
lora-explorer = "lora_explorer.main:main"
lora-explorer-tray = "lora_explorer.windows_tray:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lora_explorer = ["web/templates/*.html", "web/static/*"]
