name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # Cache the pip download dir, keyed on a hash of pyproject.toml. Edits
          # to the dependency list change the key and force a fresh resolve, so
          # the cache can never pin a stale version — it only skips re-downloading
          # byte-identical wheels.
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .[dev]
      - run: pytest tests/ -q

  # :latest tracks every push to main (unchanged) — this is the fast Force-Update
  # loop used during solo pre-release testing. Tagged releases (below) are a
  # separate, deliberate act and don't touch what :latest means.
  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # buildx (docker-container driver) is required for the type=gha layer cache
      # below; the default docker builder can't export to it.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          # Shared scope so the tagged release build (below) reuses the layers
          # this main build just cached. Content-addressed: any change to the
          # base image, copied files, or a RUN line invalidates that layer and
          # everything after it, so a stale layer can never be served.
          cache-from: type=gha,scope=lora-image
          cache-to: type=gha,scope=lora-image,mode=max

  # Fires only on a pushed tag matching v* (e.g. `git tag v0.2.0 && git push
  # origin v0.2.0`) — a deliberate, versioned release, distinct from the
  # rolling :latest above. Publishes an immutable ghcr.io image tag matching
  # the git tag and a GitHub Release with auto-generated notes, so a pinned
  # Docker deploy and a future Windows installer both have something concrete
  # to reference and update against.
  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          # Same shared scope as the main :latest build, so this release reuses
          # whatever layers didn't change since. A release always bumps the
          # version in pyproject.toml, so the dependency layer rebuilds here even
          # on a cache hit for the base image; source-only main builds still get
          # the cached dependency layer.
          cache-from: type=gha,scope=lora-image
          cache-to: type=gha,scope=lora-image,mode=max
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes

  # Builds the Windows installer and attaches it to the Release created above.
  # Only on a tagged release, same as that job — a full PyInstaller + Inno
  # Setup build is slow and this is a deliberate release artifact, not
  # something needed on every push to main.
  windows-installer:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .[windows]
      - name: Build with PyInstaller
        run: pyinstaller packaging/windows/lora-explorer.spec --noconfirm
      - name: Ensure Inno Setup is available
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version packaging\windows\installer.iss
      - name: Upload installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $asset = Get-ChildItem dist-installer\*.exe | Select-Object -First 1
          gh release upload "${{ github.ref_name }}" $asset.FullName --clobber
